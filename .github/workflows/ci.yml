name: GlossaPro pilot CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/server.mjs
      - run: bash -n scripts/*.sh
      - run: node scripts/security_check.mjs
      - run: npm test
  build-integration:
    needs: validate-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/build.sh
      - run: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/
          retention-days: 30
